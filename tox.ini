[tox]
min_version = 4.0
env_list = py312, fix_lint, lint, venv

[testenv]
deps = 
    uv
    -r requirements.txt
    -r requirements-dev.txt
commands_pre = 
    uv pip install -e .
commands = pytest {posargs}

[testenv:venv]
# Development environment - creates .venv directory
envdir = .venv
deps = 
    -r requirements.txt
    -r requirements-dev.txt
commands_pre = 
    pip install -e .
commands = python -c "import sys; print(f'Virtual environment ready at: {sys.prefix}')"

[testenv:py312]
base_python = python3.12
deps = 
    uv
    -r requirements.txt
    -r requirements-dev.txt
commands_pre = 
    uv pip install -e .
commands = pytest {posargs}

[testenv:lint]
deps = 
    uv
    -r requirements-dev.txt
commands_pre = 
    uv pip install -e .
commands = 
    ruff check src tests
    mypy src tests

[testenv:fix_lint]
deps = 
    uv
    -r requirements-dev.txt
commands_pre = 
    uv pip install -e .
commands = 
    ruff format src tests
    ruff check --fix src tests
    mypy src tests

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase